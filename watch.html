<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>Watch Video - VIDTUBE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .watch-page { max-width: 1000px; margin: 24px auto; padding: 0 16px 40px; }
    .player { width: 100%; aspect-ratio: 16 / 9; background: #050505; border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
    .player video { width: 100%; height: 100%; object-fit: contain; }
    .player-message { padding: 20px; text-align: center; color: #aaa; }
    .watch-title { margin: 20px 0 10px; overflow-wrap: anywhere; }
    .watch-note { color: #aaa; line-height: 1.6; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-icon">▶</span> VIDTUBE</a>
    <a class="primary-btn" href="index.html">Home</a>
  </header>

  <main class="watch-page">
    <div class="player" id="player">
      <p class="player-message">Loading video...</p>
    </div>
    <h1 class="watch-title" id="watchTitle">VIDTUBE Video</h1>
    <p class="watch-note" id="watchNote"></p>
    <p id="watchChannel"></p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get("t") || "VIDTUBE Video";
    const id = params.get("id") || "";

    document.getElementById("watchTitle").textContent = title;

    let uploaded = [];
    try {
      uploaded = JSON.parse(localStorage.getItem("vidtubeUploads") || "[]");
      if (!Array.isArray(uploaded)) uploaded = [];
    } catch {
      uploaded = [];
    }

    const video = uploaded.find(item => item.id === id);
    const player = document.getElementById("player");
    const note = document.getElementById("watchNote");

    if (video && video.url) {
      const element = document.createElement("video");
      element.src = video.url;
      element.controls = true;
      element.playsInline = true;
      element.preload = "metadata";
      player.replaceChildren(element);
      note.textContent = "Playback depends on the supplied direct video URL and its hosting permissions.";
      document.getElementById("watchChannel").textContent = video.channel || "";
    } else {
      player.innerHTML = '<p class="player-message">▶<br><br>No playable video is connected to this item.</p>';
      note.textContent = "This page is ready for a video player, but a title or thumbnail alone is not a video file. Connect a real hosted video to enable playback.";
    }
  </script>
</body>
</html>
